name: Daily job check

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          python test_filters.py
          python test_db.py

      - name: Run tracker
        run: python tracker.py --db jobs.db --report new_jobs.md

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add jobs.db new_jobs.md
          git diff --staged --quiet || git commit -m "Daily job check $(date -u +%F)"
          git push